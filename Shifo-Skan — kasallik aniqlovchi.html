<style>

.lg{width:48px;height:48px;border-radius:15px;background:var(--a2);display:grid;place-items:center;font-size:1.5rem;transform:rotate(-8deg);box-shadow:0 8px 20px rgba(255,106,61,.45)}
.brand b{font-family:var(--serif);font-size:1.3rem;display:block;line-height:1.1}.brand small{opacity:.65;font-size:.76rem}
.stepper{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.stepper li{display:flex;gap:12px;align-items:center;opacity:.5;font-size:.92rem;transition:.3s}
.stepper li i{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;font-style:normal;font-size:.82rem;font-weight:700;flex:none;transition:.3s}
.stepper li.cur{opacity:1;font-weight:650}.stepper li.cur i{background:var(--a2);border-color:var(--a2)}

.bign{font-family:var(--serif);font-size:3.6rem;line-height:1;color:var(--a2);font-weight:700}.bign small{font-size:1.1rem;color:var(--muted);font-weight:400}
.ico{width:84px;height:84px;border-radius:26px;background:var(--soft);display:grid;place-items:center;font-size:2.6rem;transform:rotate(-6deg);border:2px solid var(--border);animation:pop .45s ease}

.sev button b{font-size:2rem;font-weight:400;transition:.2s}.sev button span{font-weight:700;font-size:1rem}.sev button small{color:var(--muted);font-size:.75rem}

.sev .ok:hover,.sev .ok.sel{border-color:var(--good);background:rgba(47,158,99,.1)}
.sev .mid:hover,.sev .mid.sel{border-color:var(--warn);background:rgba(226,154,11,.12)}
.sev .hi:hover,.sev .hi.sel{border-color:var(--bad);background:rgba(223,74,56,.1)}
.nav{display:flex;justify-content:space-between;margin-top:24px}
.lnk{background:none;border:none;color:var(--muted);font-size:.9rem;cursor:pointer;padding:6px;font-family:inherit}.lnk:hover{color:var(--a2)}
.kb{color:var(--muted);font-size:.75rem;text-align:center;margin:8px 0 0}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--a2);font-weight:700;margin-bottom:8px}

.btn{width:100%;padding:16px;border:none;border-radius:16px;background:var(--ink);color:#fff;font-size:1.02rem;font-weight:700;cursor:pointer;margin-top:8px;transition:.2s;font-family:inherit;box-shadow:0 10px 24px rgba(13,58,57,.3)}
.btn:hover{background:var(--a2);transform:translateY(-2px);box-shadow:0 12px 26px rgba(255,106,61,.4)}
.btn.sec2{background:transparent;color:var(--text);box-shadow:none;border:2px solid var(--border)}.btn.sec2:hover{background:var(--soft);border-color:var(--a1);color:var(--text);box-shadow:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:.74rem;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--border);background:var(--paper);color:var(--text);font-size:1rem;font-family:inherit}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--a1)}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:.88rem;margin:6px 0 12px;cursor:pointer;line-height:1.45}.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--a2)}
.err{color:var(--bad);font-size:.82rem;min-height:1.1em;margin:2px 0 6px}
.banner{background:linear-gradient(135deg,var(--ink),var(--ink2));color:#fff;border-radius:24px;padding:26px;display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px;position:relative;overflow:hidden}
.banner:after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,106,61,.45),transparent 70%);right:-60px;bottom:-90px}
.banner>*{position:relative;z-index:1}.banner .eyebrow{color:#ffb59e}
.bt{font-family:var(--serif);font-size:1.7rem;line-height:1.15;margin:0 0 12px}
.tag{display:inline-block;padding:5px 12px;border-radius:99px;font-size:.74rem;font-weight:700;color:#fff}

.tabs{display:flex;gap:26px;border-bottom:2px solid var(--border);margin-bottom:22px}

.pt{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}

table{width:100%;border-collapse:collapse;font-size:.86rem}
td,th{padding:9px 6px;border-bottom:1px dashed var(--border);text-align:left}th{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns .btn{flex:1;min-width:140px}
.disc{font-size:.77rem;color:var(--muted);line-height:1.55;margin-top:18px;text-align:center}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:99px;font-size:.88rem;z-index:9}
.contact{background:var(--soft);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px}
.ch{display:flex;gap:12px;align-items:center;margin-bottom:12px}.av{width:46px;height:46px;border-radius:14px;background:var(--ink);display:grid;place-items:center;font-size:1.4rem;flex:none}
.ch b{display:block}.ch small{color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.abtn.sos{display:block;margin-top:10px;background:var(--bad);border-color:var(--bad);color:#fff}
.inl{display:flex;gap:8px}.inl input{flex:1;padding:12px;border-radius:12px;border:2px solid var(--border);background:var(--paper);color:var(--text);font-size:.95rem;min-width:0;font-family:inherit}.inl button{padding:0 18px;border:none;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.mine{margin-top:12px;font-size:.85rem;color:var(--muted)}.mine b{color:var(--text)}
.sosf{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--bad);color:#fff;text-decoration:none;font-weight:800;padding:13px 20px;border-radius:99px;box-shadow:0 10px 28px rgba(223,74,56,.5);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (max-width:820px){

.main{padding:24px 20px}.h1{font-size:1.7rem}.qt{font-size:1.4rem}.bign{font-size:2.6rem}.ico{width:68px;height:68px;font-size:2.1rem}
.banner{flex-direction:column;align-items:flex-start}.gauge{width:130px}.pt{grid-template-columns:1fr}.sev button{padding:16px 4px}}
@media print{.sosf,.contact{display:none!important}body{background:#fff;padding:0}.side,.tabs,.btns,.nav,.toast,.banner,.pv,.disc{display:none!important}.app{display:block;box-shadow:none}.main{padding:0}}
</style>

document.addEventListener("input",e=>{const t=e.target;if(t.type!=="tel")return;let d=t.value.replace(/\D/g,"");if(d.startsWith("998"))d=d.slice(3);d=d.slice(0,9);const g=[d.slice(0,2),d.slice(2,5),d.slice(5,7),d.slice(7,9)].filter(Boolean);t.value="+998"+(g.length?" "+g.join(" "):" ")});
start();
</script>
